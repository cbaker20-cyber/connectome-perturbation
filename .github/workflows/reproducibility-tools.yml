name: Reproducibility Tools

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run repository tests
        run: python -m pytest tests -q

      - name: Validate committed input manifest
        run: |
          python tools/validate_reproducibility.py \
            --input-manifest data/input_manifest.json \
            --skip-output-manifest

      - name: Compile project Python files
        run: |
          python -m compileall -q \
            model.py perturbation connectome_analysis scripts tools
