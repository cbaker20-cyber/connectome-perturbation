name: Lightweight smoke test

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run dependency-free checks
        run: |
          python tools/validate_research_docs.py
          python tools/check_repo_artifact_policy.py
          python tools/check_no_unsafe_id_parsing.py --changed-only --base-ref sts-bora-framework-20260623
