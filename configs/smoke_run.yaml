# Tiny metadata-first smoke configuration.
# This file is intentionally conservative: it should be safe to use before any expensive simulation.

run_name: smoke_reproducibility_metadata
experiment_id: E010
experiment_registry_path: 03_EXPERIMENT_REGISTRY.csv
random_seed: 42
selected_materialization: "630"
selected_inputs:
  completeness: 2023_03_23_completeness_630_final.csv
  connectivity: 2023_03_23_connectivity_630_final.parquet
  annotations: flywire_annotations.tsv
mode: metadata_only
max_runtime_seconds: 60
max_neurons: 10
max_edges: 100
input_manifest: data/input_manifest.json
output_manifest: output_manifest.json
results_dir: results/smoke
notes:
  - This config does not validate biological output.
  - Its first purpose is to prove manifest/path/output-metadata plumbing works from a clean checkout.
  - Do not use this config for claims or figures.